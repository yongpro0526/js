<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="js/jquery-3.7.1.min.js"></script>

</head>
<body>

    /api/v1/getJSON

    <script>
        $.ajax({
            type: "post", // 요청타입 - get, post
            url: "http://localhost:8181/chap06/api/v1/getJSON",
            contentType: "application/json", // 보내는 데이터타입(필수)
            data: JSON.stringify({name: "홍길동", num: 1}), // 보낼 데이터
            success: function(data) {
                console.log(data);
            },
            error: function(err) {
                console.log(err);
            }
        })
    </script>
    
</body>
</html>
